[package]
name = "a_simple_life"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = 2
strip = "none"
split-debuginfo = "packed"
codegen-units = 16
panic = "unwind"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "must_cast"] }
memory-stats = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
terminal_size = "0.4.4"
wide = "1.6.1"

[dev-dependencies]
syn = { version = "3.0.4", features = ["full", "visit"] }
tree-sitter = "0.26.13"
tree-sitter-c = "0.24.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
expect_used = "deny"
large_enum_variant = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
