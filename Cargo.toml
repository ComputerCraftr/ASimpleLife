[package]
name = "a_simple_life"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.release-debug]
inherits = "release"
debug = 2
strip = "none"
split-debuginfo = "packed"
codegen-units = 16
panic = "unwind"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "must_cast"] }
crossterm = "0.29.0"
memory-stats = "1.2.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
terminal_size = "0.4.4"
wide = "1.7.0"

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "signal", "term"] }
vt100 = "0.16.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[[bin]]
name = "bf_life"
path = "src/bin/bf_life.rs"
test = false

[[bin]]
name = "classify_bench"
path = "src/bin/classify_bench.rs"
test = false

[[bin]]
name = "hashlife_perf_gate"
path = "src/bin/hashlife_perf_gate.rs"
test = false

[dev-dependencies]
yaml_serde = "0.10.7"
syn = { version = "3.0.5", features = ["full", "visit"] }
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
expect_used = "deny"
large_enum_variant = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
