name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Check every target and feature
        run: cargo check --workspace --all-targets --all-features
      - name: Run release tests
        run: cargo test --workspace --all-features --release -- --nocapture

  static-crt-musl:
    name: Static CRT (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: x86_64-unknown-linux-musl
      - name: Verify Cargo enables static CRT
        shell: bash
        run: |
          cargo rustc --lib --target x86_64-unknown-linux-musl -- --print cfg \
            | grep -F 'target_feature="crt-static"'
      - name: Link release binaries against musl statically
        run: cargo build --workspace --all-features --release --target x86_64-unknown-linux-musl
      - name: Reject dynamic dependencies in the musl executable
        shell: bash
        run: |
          count=0
          while IFS= read -r executable; do
            count=$((count + 1))
            if readelf -d "$executable" | grep -q '(NEEDED)'; then
              echo "musl executable contains a dynamic dependency: $executable" >&2
              exit 1
            fi
          done < <(find target/x86_64-unknown-linux-musl/release -maxdepth 1 \
            -type f -perm -111 -print)
          test "$count" -gt 0

  static-crt-msvc:
    name: Static CRT (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Verify Cargo enables static CRT
        shell: pwsh
        run: |
          $cfg = cargo rustc --lib --target x86_64-pc-windows-msvc -- --print cfg
          if ($cfg -notcontains 'target_feature="crt-static"') {
            throw 'Cargo did not enable the static MSVC CRT'
          }
      - name: Link release binaries against the static MSVC CRT
        run: cargo build --workspace --all-features --release --target x86_64-pc-windows-msvc
      - name: Reject dynamic MSVC CRT imports in every executable
        shell: pwsh
        run: |
          $executables = Get-ChildItem target/x86_64-pc-windows-msvc/release/*.exe
          if ($executables.Count -eq 0) {
            throw 'MSVC build produced no executable artifacts'
          }
          foreach ($executable in $executables) {
            $imports = llvm-readobj --coff-imports $executable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "failed to inspect $($executable.FullName)"
            }
            if ($imports -match '(?i)(vcruntime|msvcp|ucrtbase)[^\r\n]*\.dll') {
              throw "dynamic MSVC CRT import found in $($executable.FullName)"
            }
          }

  native-kernels:
    name: Native kernels (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AVX2
            os: ubuntu-latest
            rustflags: -C target-feature=+avx2
          - name: AArch64 NEON
            os: macos-14
            rustflags: -C target-feature=+neon
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Differential-test native HashLife kernels
        run: cargo test --release hashlife::kernels::tests -- --nocapture
      - name: Reject identity-order D4 canonicalization regressions
        run: cargo test --release tests::hashlife_cache::hashlife_d4 -- --nocapture
      - name: Exercise generated-C native scan kernels
        run: cargo test --release bf::tests::c_super_runtime::generated_c_scan_uses_the_runtime_selected_kernel -- --nocapture
      - name: Exercise generated-C native add and clear kernels
        run: cargo test --release bf::tests::c_super_runtime::emitted_simd -- --nocapture
      - name: Exercise generated-C native transfer kernels and alias fallback
        run: cargo test --release bf::tests::c_super_runtime::emitted_distribute_uses_transfer_kernel_and_wrapped_aliases_fall_back -- --nocapture
      - name: Exercise generated-C native summary and probe kernels
        run: cargo test --release bf::tests::c_super_runtime::super_c_runtime_summary_and_probe_use_their_kernel_families -- --nocapture
      - name: Differential-test generated-C native kernels against scalar
        run: cargo test --release bf::tests::c_super_runtime::generated_c_batched_kernels_match_forced_scalar_with_wrapped_addresses -- --nocapture

  scalar-fallback:
    name: Forced scalar fallback
    runs-on: ubuntu-latest
    env:
      ASIMPLELIFE_HASHLIFE_KERNEL: scalar
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Run scalar kernel differential tests
        run: cargo test --release hashlife::kernels::tests -- --nocapture
      - name: Run HashLife correctness under scalar dispatch
        run: cargo test --release tests::hashlife_correctness -- --nocapture

  generated-c:
    name: Generated C strict and sanitizer gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Compile strict C23-compatible templates
        run: cargo test template_compiles_standalone_under_strict_c23_compatibility_mode -- --nocapture
      - name: Run generated-C ASan and UBSan regressions
        run: cargo test runtime_is_clean_under_asan_ubsan -- --nocapture

  quality:
    name: Formatting, policies, and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy, rustfmt
      - name: Validate the unified workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check source policies
        run: cargo test --all-features source_shape -- --nocapture
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  miri:
    name: Nightly Miri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
      ASIMPLELIFE_HASHLIFE_KERNEL: scalar
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: miri
      - name: Prepare Miri
        run: cargo miri setup
      - name: Check probe-table unsafe storage contracts
        run: |
          cargo miri test --lib probe_table::tests::miri_probe_table_storage_lifecycle_preserves_initialized_slots -- --exact --test-threads=1
          cargo miri test --lib probe_table::tests::append_only_gc_tombstones_are_reused_without_rehash_allocation -- --exact --test-threads=1
          cargo miri test --lib probe_table::tests::fallible_reserve_rejects_capacity_overflow_without_mutation -- --exact --test-threads=1
      - name: Check centralized scalar mixers
        run: cargo miri test --lib hashing::tests::murmur3_fmix64_matches_reference_vectors -- --exact --test-threads=1
      - name: Check bounded allocation, population, and scalar kernel contracts
        run: |
          cargo miri test --lib hashlife::memory::tests::replacement_reservation_does_not_charge_retained_bytes_twice -- --exact --test-threads=1
          cargo miri test --lib hashlife::memory::tests::checked_allocator_boundaries_reject_unrepresentable_values -- --exact --test-threads=1
          cargo miri test --lib hashlife::population::tests::population_saturation_matches_three_limb_oracle -- --exact --test-threads=1
          cargo miri test --lib hashlife::kernels::tests::control_match_contract_handles_collisions_and_poisoned_tags -- --exact --test-threads=1
          cargo miri test --lib hashlife::kernels::tests::dedup_contract_requires_fingerprint_and_full_key_equality -- --exact --test-threads=1
