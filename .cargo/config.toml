# MSVC defaults to the dynamic CRT, so select the static variant explicitly.
# musl target specifications already default to crt-static; src/lib.rs rejects
# attempts to disable it. Do not force this flag for a native musl host because
# proc-macro crates must remain loadable compiler plugins.
[target.'cfg(target_env = "msvc")']
rustflags = ["-C", "target-feature=+crt-static"]
